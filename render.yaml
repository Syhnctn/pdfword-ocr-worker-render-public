services:
  - type: web
    name: pdfword-ocr-worker
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./backend/ocr_worker/Dockerfile
    dockerContext: ./backend/ocr_worker
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OCR_INPUT_BUCKET
        value: ocr-inputs
      - key: OCR_RESULTS_BUCKET
        value: ocr-results
      - key: OCR_WORKER_SECRET
        sync: false
      - key: OPEN_SOURCE_OCR_ENABLED
        value: "true"
      - key: OCRMYPDF_ENABLED
        value: "true"
      - key: OCRMYPDF_LANG
        value: tur+eng
      - key: OCRMYPDF_JOBS
        value: "1"
      - key: OCRMYPDF_TIMEOUT_SEC
        value: "240"
      - key: OCRMYPDF_TESSERACT_TIMEOUT_SEC
        value: "60"
      - key: OCRMYPDF_FORCE_OCR
        value: "true"
      - key: OCRMYPDF_ROTATE_PAGES
        value: "false"
      - key: OCRMYPDF_DESKEW
        value: "false"
      - key: OCRMYPDF_CLEAN_FINAL
        value: "false"
      - key: OCRMYPDF_OUTPUT_TYPE
        value: pdf
      - key: TESSERACT_LANG
        value: tur
      - key: TESSERACT_DPI
        value: "300"
      - key: TESSERACT_PSM
        value: "6"
      - key: TESSERACT_OEM
        value: "1"
      - key: TESSERACT_PSM_CANDIDATES
        value: 6,4
      - key: TESSERACT_MAX_VARIANTS
        value: "3"
      - key: TESSERACT_CALL_TIMEOUT_SEC
        value: "10"
      - key: TESSERACT_MAX_ATTEMPTS
        value: "3"
      - key: LIGHTON_OCR_ENDPOINT
        sync: false
      - key: LIGHTON_OCR_TOKEN
        sync: false
